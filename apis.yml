aid: aiperia
name: Aiperia
description: Aiperia (formerly PlanerAI) is a German AI company whose SaaS platform automates
  demand forecasting and fresh-food supply-chain planning from production through to the end
  consumer. Its machine-learning models predict fresh-food demand up to 21 days ahead using
  around 150 external factors, then generate automated order and production suggestions for
  bakeries and self-service stations, food manufacturers, and supermarkets to reduce food
  waste and overproduction. Aiperia is a portfolio company of Earlybird Venture Capital.
